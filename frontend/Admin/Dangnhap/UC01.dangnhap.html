<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UC01 - Đăng Nhập Hệ Thống</title>
    <!-- Font Awesome dùng cho Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dangnhap.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-box">
            <!-- Header Brand -->
            <div class="login-header">
                <div class="brand-logo">
                    <i class="fa-solid fa-house-chimney-window"></i>
                </div>
                <h2>QUẢN LÝ PHÒNG TRỌ</h2>
                <p>Đăng nhập hệ thống quản trị</p>
            </div>

            <!-- Form Đăng Nhập -->
            <form id="loginForm" class="login-form">
                <!-- Thông báo lỗi -->
                <div id="errorMessage" class="error-alert" style="display: none;">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="errorText">Tên đăng nhập hoặc mật khẩu không đúng!</span>
                </div>

                <!-- Input Tài khoản / Email -->
                <div class="input-group">
                    <label for="username">Tên đăng nhập / Email</label>
                    <div class="input-field">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" placeholder="Nhập tên đăng nhập hoặc email..." required>
                    </div>
                </div>

                <!-- Input Mật khẩu -->
                <div class="input-group">
                    <label for="password">Mật khẩu</label>
                    <div class="input-field">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Nhập mật khẩu..." required>
                        <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <!-- Ghi nhớ & Quên mật khẩu -->
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Ghi nhớ đăng nhập</span>
                    </label>
                    <a href="#" class="forgot-password">Quên mật khẩu?</a>
                </div>

                <!-- Nút Đăng nhập -->
                <button type="submit" class="btn-login" id="btnLogin">
                    <span>ĐĂNG NHẬP</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>

            <div class="login-footer">
                <p>© 2026 Boarding House Management. All rights reserved.</p>
            </div>
        </div>
    </div>

    <script src="script-login.js"></script>
</body>
</html>
