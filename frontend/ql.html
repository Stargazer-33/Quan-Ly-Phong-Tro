<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý nhà trọ - Phân hệ Quản lý</title>
    <link rel="stylesheet" href="css/QuanLi.css">
</head>

<body>

    <div class="dashboard">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <!-- LOGO -->
            <div class="sidebar-logo">
                <img src="../img/logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/40'">
                <div>
                    <strong>An Bình Boarding</strong>
                    <span>Quản lý</span>
                </div>
            </div>

            <!-- MENU DÀNH CHO QUẢN LÝ -->
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-function="UC03 - Quản lý phòng">
                    Quản lý phòng
                </a>
                <a href="#" class="nav-item" data-function="UC04 - Quản lý khách thuê">
                    Quản lý khách thuê
                </a>
                <a href="#" class="nav-item" data-function="UC05 - Quản lý hợp đồng">
                    Quản lý hợp đồng
                </a>
                <a href="#" class="nav-item" data-function="UC07 - Ghi chỉ số điện/nước">
                    Ghi chỉ số điện/nước
                </a>
                <a href="#" class="nav-item" data-function="UC08 - Tạo hóa đơn">
                    Tạo hóa đơn
                </a>
                <a href="#" class="nav-item" data-function="UC09 - Gửi link hóa đơn">
                    Gửi link hóa đơn
                </a>
                <a href="#" class="nav-item" data-function="UC11 - Cập nhật thanh toán">
                    Cập nhật thanh toán
                </a>
                <a href="#" class="nav-item" data-function="UC12 - Quản lý sự cố">
                    Quản lý sự cố
                </a>
            </nav>

            <!-- SIDEBAR BOTTOM -->
            <div class="sidebar-bottom">
                <p>Bản demo vận hành Quản lý</p>
            </div>

        </aside>

        <!-- MAIN CONTENT -->
        <main class="content">

            <!-- TOP BAR -->
            <div class="top-bar">

                <div class="content-header">
                    <h1>Quản lý phòng cho quản lý</h1>
                    <p>Quản lý nhà trọ</p>
                </div>

                <!-- PROFILE -->
                <div class="profile">
                    <button class="avatar-btn" id="avatarBtn">A</button>

                    <!-- PROFILE POPUP -->
                    <div class="profile-menu" id="profileMenu">
                        <div class="profile-info">
                            <div class="big-avatar">A</div>
                            <div>
                                <strong>Nguyễn Văn An</strong>
                                <p>quanly@gmail.com</p>
                            </div>
                        </div>
                        <hr>
                        <button id="profileBtn">Thông tin cá nhân</button>
                        <button id="changePasswordBtn">Đổi mật khẩu (UC17)</button>
                        <button id="logoutProfileBtn">Đăng xuất</button>
                    </div>
                </div>

            </div>

            <!-- CONTENT DYNAMIC -->
            <div class="main-content">
                <!-- Nội dung các chức năng sẽ hiển thị ở đây qua JS -->
            </div>

        </main>

    </div>

    <script src="js/QuanLi.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
