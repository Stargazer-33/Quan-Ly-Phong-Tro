<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý nhà trọ</title>

    <link rel="stylesheet" href="css/KhachThue.css">
</head>

<body>

    <div class="dashboard">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <!-- LOGO -->
            <div class="sidebar-logo">

                <img src="../img/logo.png" alt="Logo">

                <div>
                    <strong>'s boarding house</strong>
                    <span>Khách thuê</span>
                </div>

            </div>


            <!-- MENU -->
            <nav class="sidebar-nav">

                <a href="#" class="nav-item active"
                    data-function="Chức năng 1">
                    Chức năng 1
                </a>

                <a href="#" class="nav-item"
                    data-function="Chức năng 2">
                    Chức năng 2
                </a>

                <a href="#" class="nav-item"
                    data-function="Chức năng 3">
                    Chức năng 3
                </a>

                <a href="#" class="nav-item"
                    data-function="Chức năng 4">
                    Chức năng 4
                </a>

                <a href="#" class="nav-item"
                    data-function="Chức năng 5">
                    Chức năng 5
                </a>

            </nav>


            <!-- SIDEBAR BOTTOM -->
            <div class="sidebar-bottom">
                <p>Bản demo giao diện</p>
            </div>

        </aside>


        <!-- MAIN -->
        <main class="content">

            <!-- TOP BAR -->
            <div class="top-bar">

                <div class="content-header">

                    <h1>Chức năng 1 cho khách</h1>

                    <p>Quản lý nhà trọ</p>

                </div>


                <!-- PROFILE -->
                <div class="profile">

                    <button class="avatar-btn" id="avatarBtn">
                        A
                    </button>


                    <!-- PROFILE POPUP -->
                    <div class="profile-menu" id="profileMenu">

                        <div class="profile-info">

                            <div class="big-avatar">
                                A
                            </div>

                            <div>
                                <strong>User</strong>
                                <p>user@gmail.com</p>
                            </div>

                        </div>


                        <hr>


                        <button id="profileBtn">
                            Thông tin cá nhân
                        </button>

                        <button id="changePasswordBtn">
                            Đổi mật khẩu
                        </button>

                        <button id="logoutProfileBtn">
                            Đăng xuất
                        </button>

                    </div>

                </div>

            </div>


            <!-- CONTENT -->
            <div class="main-content">

                <div class="card-header">

                    <div>

                        <h2>Chức năng 1</h2>

                        <p>Thông tin tổng quan</p>

                    </div>


                    <span class="status">
                        Đang hoạt động
                    </span>

                </div>


                <div class="card-body">

                    <div class="info-card">

                        <span class="info-title">
                            Tổng số phòng
                        </span>

                        <strong>
                            20
                        </strong>

                    </div>


                    <div class="info-card">

                        <span class="info-title">
                            Đang cho thuê
                        </span>

                        <strong>
                            15
                        </strong>

                    </div>


                    <div class="info-card">

                        <span class="info-title">
                            Phòng trống
                        </span>

                        <strong>
                            5
                        </strong>

                    </div>

                </div>

            </div>

        </main>

    </div>


    <script src="js/KhachThue.js"></script>
<script src="js/auth.js"></script>
</body>

</html>
