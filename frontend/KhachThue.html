<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý nhà trọ - Khách Thuê</title>
    <link rel="stylesheet" href="css/KhachThue.css">
</head>

<body>

    <div class="dashboard">

        <!-- SIDEBAR --> 
        <aside class="sidebar">

            <!-- LOGO -->
            <div class="sidebar-logo">
                <img src="../img/logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/40'">
                <div>
                    <strong>'s boarding house</strong>
                    <span>Khách thuê</span>
                </div>
            </div>

            <!-- MENU -->
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-function="Báo cáo sự cố">
                    Báo cáo sự cố
                </a>
                <a href="#" class="nav-item" data-function="Xem hóa đơn">
                    Xem hóa đơn
                </a>
                <a href="#" class="nav-item" data-function="Hợp đồng thuê">
                    Hợp đồng thuê
                </a>
                <a href="#" class="nav-item" data-function="Thông báo">
                    Thông báo
                </a>
                <a href="#" class="nav-item" data-function="Thành viên ở cùng">
                    Thành viên ở cùng
                </a>
                <a href="#" class="nav-item" data-function="Đổi mật khẩu">
                    Đổi mật khẩu
                </a>
            </nav>

            <!-- SIDEBAR BOTTOM -->
            <div class="sidebar-bottom">
                <p>Bản demo giao diện</p>
            </div>

        </aside>

        <!-- MAIN CONTENT -->
        <main class="content">

            <!-- TOP BAR -->
            <div class="top-bar">
                <div class="content-header">
                    <h1 id="pageTitle">Báo cáo sự cố</h1>
                    <p>Quản lý nhà trọ</p>
                </div>

                <!-- PROFILE -->
                <div class="profile">
                    <button class="avatar-btn" id="avatarBtn">A</button>

                    <!-- PROFILE POPUP -->
                    <div class="profile-menu" id="profileMenu" style="display: none;">
                        <div class="profile-info">
                            <div class="big-avatar">A</div>
                            <div>
                                <strong>Khách Thuê</strong>
                                <p>khachthue@gmail.com</p>
                            </div>
                        </div>

                        <hr>

                        <button id="profileBtn">Thông tin cá nhân</button>
                        <button id="changePasswordBtn">Đổi mật khẩu</button>
                        <button id="logoutProfileBtn" style="color: #dc2626;">Đăng xuất</button>
</div>
                </div>
            </div>

            <!-- MAIN CONTENT AREA -->
            <div class="main-content" id="mainContent">
                <!-- Nội dung được js/KhachThue.js render động -->
            </div>

        </main>

    </div>

    <script src="js/KhachThue.js"></script>
</body>

</html>
