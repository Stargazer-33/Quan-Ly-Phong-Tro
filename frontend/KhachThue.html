<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý nhà trọ - Khách Thuê</title>
    <link rel="stylesheet" href="css/KhachThue.css">
</head>

<body>

    <div class="dashboard">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <!-- LOGO -->
            <div class="sidebar-logo">
                <img src="../img/logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/40'">
                <div>
                    <strong id="brandName">Nhà trọ</strong>
                    <span>Khách thuê</span>
                </div>
            </div>

            <!-- MENU -->
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-function="Tổng quan">
                    Tổng quan
                </a>
                <a href="#" class="nav-item" data-function="Báo cáo sự cố">
                    Báo cáo sự cố
                </a>
                <a href="#" class="nav-item" data-function="Xem hóa đơn">
                    Xem hóa đơn
                </a>
                <a href="#" class="nav-item" data-function="Hợp đồng thuê">
                    Hợp đồng thuê
                </a>
                <a href="#" class="nav-item" data-function="Chỉ số điện nước">
                    Chỉ số điện nước
                </a>
                <a href="#" class="nav-item" data-function="Thông báo">
                    Thông báo
                </a>
                <a href="#" class="nav-item" data-function="Thành viên ở cùng">
                    Thành viên ở cùng
                </a>
                <a href="#" class="nav-item" data-function="Đổi mật khẩu">
                    Đổi mật khẩu
                </a>
            </nav>

            <!-- SIDEBAR BOTTOM -->
            <div class="sidebar-bottom">
                <p id="sidebarFooter">Đang tải cơ sở...</p>
            </div>

        </aside>

        <!-- MAIN CONTENT -->
        <main class="content">

            <!-- TOP BAR -->
            <div class="top-bar">
                <div class="content-header">
                    <h1 id="pageTitle">Tổng quan</h1>
                    <p>Quản lý nhà trọ</p>
                </div>

                <!-- PROFILE -->
                <div class="profile">
                    <button class="avatar-btn" id="avatarBtn" title="Tài khoản">?</button>

                    <!-- PROFILE POPUP -->
                    <div class="profile-menu" id="profileMenu" hidden>
                        <div class="profile-info">
                            <div class="big-avatar" id="profileAvatar">?</div>
                            <div>
                                <strong id="profileName">Khách thuê</strong>
                                <p id="profileEmail">Đang tải...</p>
                            </div>
                        </div>

                        <hr>

                        <button id="profileBtn">Thông tin cá nhân</button>
                        <button id="changePasswordBtn">Đổi mật khẩu</button>
                        <button id="logoutProfileBtn" style="color: #dc2626;">Đăng xuất</button>
                    </div>
                </div>
            </div>

            <!-- MAIN CONTENT AREA -->
            <div class="main-content" id="mainContent">
                <div class="card">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Đang tải dữ liệu...</p>
                    </div>
                </div>
            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/rentalData.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/tenantData.js"></script>
    <script src="js/KhachThue.js"></script>
</body>

</html>
