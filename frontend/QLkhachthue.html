<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Khách Thuê - US06</title>
    <link rel="stylesheet" href="css/UC06.css">
</head>
<body>

    <!-- Header Đồng Bộ Style -->
    <header class="navbar">
        <div class="logo">
            <span class="logo-icon">P</span>'s boarding house
        </div>
        <div class="user-info">
            <span>Xin chào, <strong>Quản lý</strong></span>
        </div>
    </header>

    <!-- Content chính US06 -->
    <main class="container">
        <div class="page-header">
            <span class="sub-title">HỆ THỐNG QUẢN LÝ PHÒNG TRỌ</span>
            <h1 class="main-title">Quản lý <span class="highlight">khách thuê</span></h1>
            <p class="description">Thêm mới, cập nhật thông tin và theo dõi danh sách khách thuê trọ trong hệ thống.</p>
        </div>

        <!-- Form Nhập / Sửa Dữ Liệu -->
        <div class="card form-card">
            <h3 class="card-title">Thông tin khách thuê</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Họ và tên (*)</label>
                    <input type="text" id="fullName" placeholder="Nhập họ và tên">
                </div>
                <div class="form-group">
                    <label>Số điện thoại (*)</label>
                    <input type="text" id="phone" placeholder="Nhập số điện thoại">
                </div>
                <div class="form-group">
                    <label>Số CCCD/CMND (*)</label>
                    <input type="text" id="idCard" placeholder="Nhập số CCCD/CMND">
                </div>
                <div class="form-group">
                    <label>Số phòng (*)</label>
                    <input type="text" id="room" placeholder="Ví dụ: P101">
                </div>
                <div class="form-group">
                    <label>Trạng thái</label>
                    <select id="status">
                        <option value="Active">Đang ở</option>
                        <option value="Inactive">Đã trả phòng</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button id="btnSubmit" class="btn btn-blue" onclick="handleSubmit()">Thêm Khách Thuê</button>
                <button id="btnUpdate" class="btn btn-orange" onclick="handleSubmit()" style="display: none;">Cập Nhật</button>
                <button id="btnCancel" class="btn btn-outline" onclick="cancelEdit()" style="display: none;">Hủy</button>
            </div>
        </div>

        <!-- Danh Sách & Tìm Kiếm -->
        <div class="card">
            <div class="table-header">
                <h3 class="card-title">Danh sách khách thuê</h3>
                <div class="search-box">
                    <input type="text" id="searchKey" placeholder="Tìm theo tên, SĐT hoặc phòng..." onkeyup="filterTenants()">
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Họ Và Tên</th>
                            <th>Số Điện Thoại</th>
                            <th>CCCD/CMND</th>
                            <th>Phòng</th>
                            <th>Trạng Thái</th>
                            <th>Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody id="tenantList"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
